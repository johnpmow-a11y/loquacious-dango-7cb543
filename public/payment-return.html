<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Payment status — All Ads Manager</title>
<style>
body{margin:0;background:#f5f7fb;color:#111827;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:28px;max-width:440px;width:calc(100% - 40px);text-align:center;box-shadow:0 12px 35px #11182712}
button{border:0;border-radius:12px;padding:13px 18px;background:#111827;color:#fff;font-weight:700;width:100%;margin-top:16px}
.muted{color:#6b7280;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<h2 id="title">Checking your payment…</h2>
<p class="muted" id="message">Please wait while All Ads Manager confirms the payment with Paystack.</p>
<button id="back" hidden onclick="location.href='/'">Return to All Ads Manager</button>
</main>
<script>
(async()=>{
 const q=new URLSearchParams(location.search);
 const reference=q.get('reference')||sessionStorage.getItem('btPendingPaymentReference');
 const token=sessionStorage.getItem('btToken');
 const title=document.getElementById('title');
 const message=document.getElementById('message');
 const back=document.getElementById('back');
 if(!reference||!token){
  title.textContent='Payment check unavailable';
  message.textContent='Please log in to All Ads Manager and check your payment history.';
  back.hidden=false;
  return;
 }
 let lastMessage='Payment is still being confirmed. Please wait.';
 for(let attempt=1;attempt<=5;attempt++){
  title.textContent='Checking your payment…';
  message.textContent='Secure verification attempt '+attempt+' of 5. Please do not pay again while this check is running.';
  try{
   const controller=new AbortController();
   const timeout=setTimeout(()=>controller.abort(),12000);
   let response;
   try{
    response=await fetch('/.netlify/functions/paystack-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{signal:controller.signal,cache:'no-store'});
   }finally{clearTimeout(timeout);}
   const data=await response.json().catch(()=>({}));
   if(response.ok&&data.status==='success'){
    title.textContent='Payment successful';
    message.textContent=data.message||'Your wallet has been credited. Return to the dashboard to see your updated balance.';
    sessionStorage.removeItem('btPendingPaymentReference');
    back.hidden=false;
    return;
   }
   if([400,401,404].includes(response.status)){
    title.textContent='Payment check unavailable';
    message.textContent=data.error||'Please log in again and check your payment history.';
    back.hidden=false;
    return;
   }
   lastMessage=data.error||data.message||'Paystack has not confirmed the payment yet.';
  }catch(error){
   lastMessage=error.name==='AbortError'?'The verification request took too long. Retrying securely.':(error.message||'A temporary connection problem occurred.');
  }
  if(attempt<5)await new Promise(resolve=>setTimeout(resolve,2000));
 }
 title.textContent='Payment not confirmed yet';
 message.textContent=lastMessage+' Do not pay again. Check Payment History or contact support if your bank has already debited you.';
 back.hidden=false;
})();
</script>
</body>
</html>
