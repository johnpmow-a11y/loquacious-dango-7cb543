<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Admin Wallet Payment</title><style>body{font:16px Arial,sans-serif;background:#f3f5f9;color:#172033;padding:25px}.card{max-width:520px;margin:12vh auto;background:#fff;padding:26px;border-radius:16px;box-shadow:0 5px 20px #15223a12}a{display:inline-block;background:#155eef;color:white;text-decoration:none;padding:13px 18px;border-radius:9px;margin-top:15px}.muted{color:#64748b}.error{color:#b42318}</style></head><body><main class="card"><h2>Admin Wallet Payment</h2><p id="message" class="muted">Verifying your Paystack payment securely…</p><a href="/admin-wallet.html">Open Admin Wallet</a></main><script>
(async function(){
 const q=new URLSearchParams(location.search),reference=q.get('reference')||'',token=sessionStorage.getItem('btAdminToken'),el=document.getElementById('message');
 if(!reference||!token){el.className='error';el.textContent='Payment reference or admin session is missing. Log in again and check Admin Wallet deposits.';return;}
 let last='Payment is still awaiting Paystack confirmation.';
 for(let attempt=1;attempt<=5;attempt++){
  el.className='muted';el.textContent='Secure verification attempt '+attempt+' of 5. Please wait; do not pay again while this check runs.';
  try{
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
   let r,d;try{r=await fetch('/.netlify/functions/admin-wallet-verify?reference='+encodeURIComponent(reference)+'&token='+encodeURIComponent(token),{cache:'no-store',signal:controller.signal});d=await r.json().catch(()=>({}));}finally{clearTimeout(timer);}
   if(r.ok&&d.status==='success'){el.textContent=d.message||'Payment confirmed. Admin Wallet has been credited.';return;}
   if([400,401,404].includes(r.status)){el.className='error';el.textContent=d.error||'Please log in again and check Admin Wallet.';return;}
   last=d.error||d.message||last;
  }catch(e){last=e.name==='AbortError'?'The verification request timed out. Retrying securely.':(e.message||last);}
  if(attempt<5)await new Promise(resolve=>setTimeout(resolve,2000));
 }
 el.className='error';el.textContent=last+' Do not pay again. Open Admin Wallet and check the deposit status.';
})();
</script></body></html>
