# Replace the placeholder app name with your own unique Fly.io app name before deployment.
app = "all-ads-manager-change-this"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/_healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
