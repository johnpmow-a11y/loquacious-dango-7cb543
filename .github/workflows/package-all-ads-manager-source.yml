name: Verify and package All Ads Manager

on:
  push:
    branches:
      - feature/composio-ads-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and verify server dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "import('@simplewebauthn/server').then(m => { for (const name of ['generateRegistrationOptions','verifyRegistrationResponse','generateAuthenticationOptions','verifyAuthenticationResponse']) if (typeof m[name] !== 'function') throw new Error('Missing WebAuthn export: ' + name); console.log('WebAuthn server package exports verified.'); })"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -type f -name '*.mjs' -not -path './.git/*' -print0)
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find public netlify -type f -name '*.js' -print0)
      - name: Check inline JavaScript in HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          count = 0
          with tempfile.TemporaryDirectory() as tmp:
              for html in Path('.').rglob('*.html'):
                  if '.git' in html.parts or 'node_modules' in html.parts:
                      continue
                  source = html.read_text(encoding='utf-8', errors='replace')
                  for match in re.finditer(r'<script\b([^>]*)>([\s\S]*?)</script>', source, re.I):
                      attrs, body = match.group(1), match.group(2)
                      if 'src=' in attrs.lower() or 'importmap' in attrs.lower() or 'application/json' in attrs.lower():
                          continue
                      if not body.strip():
                          continue
                      path = Path(tmp) / f'inline-{count}.js'
                      path.write_text(body, encoding='utf-8')
                      subprocess.run(['node', '--check', str(path)], check=True)
                      count += 1
          print(f'Checked {count} inline script blocks.')
          PY
      - name: Run current application contract checks
        run: node scripts/check-social-contracts.mjs
      - name: Build Fly.io deployment image
        run: docker build --tag all-ads-manager:ci .

  package:
    # Package on every push after verification, so the latest tested source is downloadable.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP and verify archive
        run: |
          zip -qr All-Ads-Manager-Final-Source.zip . -x './.git/*' './node_modules/*' './All-Ads-Manager-Final-Source.zip'
          unzip -t All-Ads-Manager-Final-Source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: All-Ads-Manager-Final-Source
          path: All-Ads-Manager-Final-Source.zip
          if-no-files-found: error
          retention-days: 7
