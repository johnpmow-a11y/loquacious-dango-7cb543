name: Prepare All Ads Manager ZIP

on:
  push:
    branches:
      - fix/livekit-call-media-attachment
    paths:
      - '.github/workflows/prepare-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact development branch
        uses: actions/checkout@v4
      - name: Create Netlify-ready ZIP
        run: |
          zip -r All-Ads-Manager-latest.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'node_modules/*' \
            -x '.env' \
            -x '.env.*' \
            -x '**/.env' \
            -x '**/.env.*'
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-Ads-Manager-latest
          path: All-Ads-Manager-latest.zip
          if-no-files-found: error
          retention-days: 7
